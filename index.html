<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gelbe Welle — Karte</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css" crossorigin="anonymous" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    #map { width: 100%; height: 100vh; }

    /* Bottom sheet */
    #sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
      transform: translateY(100%);
      transition: transform 0.3s ease;
      max-height: 55vh;
      overflow-y: auto;
      z-index: 1000;
    }
    #sheet.open { transform: translateY(0); }
    #sheet-handle {
      width: 40px; height: 4px;
      background: #D1D5DB;
      border-radius: 2px;
      margin: 10px auto 0;
    }
    #sheet-content { padding: 16px 20px 24px; }
    #sheet-name {
      font-size: 20px; font-weight: 700;
      color: #2C3E50; margin-bottom: 4px;
    }
    #sheet-anleger {
      font-size: 15px; color: #5D6D7E;
      margin-bottom: 12px;
    }
    .sheet-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #E5E7EB;
      font-size: 14px;
    }
    .sheet-label { color: #5D6D7E; }
    .sheet-value { color: #2C3E50; font-weight: 500; text-align: right; }
    .sheet-value a { color: #4682A9; text-decoration: none; }
    .sheet-value a:hover { text-decoration: underline; }

    /* Control buttons */
    .map-btn {
      position: fixed;
      right: 16px;
      width: 44px; height: 44px;
      background: #fff;
      border: none; border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      cursor: pointer;
      font-size: 20px;
      z-index: 999;
      display: flex; align-items: center; justify-content: center;
      transition: bottom 0.3s ease;
    }
    #locateBtn { bottom: 24px; }
    #locateBtn.shifted { bottom: calc(55vh + 16px); }
    #satelliteBtn { bottom: 76px; }
    #satelliteBtn.shifted { bottom: calc(55vh + 68px); }
    #satelliteBtn.active { background: #4682A9; color: #fff; }
    #seamapBtn { bottom: 128px; }
    #seamapBtn.shifted { bottom: calc(55vh + 120px); }
    #seamapBtn.active { background: #4682A9; color: #fff; }
  </style>
</head>
<body>
  <div id="map"></div>
  <button class="map-btn" id="seamapBtn" title="OpenSeaMap ein/aus">⚓</button>
  <button class="map-btn" id="satelliteBtn" title="Satellit ein/aus">🛰</button>
  <button class="map-btn" id="locateBtn" title="Mein Standort">📍</button>
  <div id="sheet">
    <div id="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js" crossorigin="anonymous"></script>
  <script>
    // --- Landscape-style colors (applied to OpenFreeMap bright style) ---
    const COLOR_OVERRIDES = {
      // Water — vivid blue
      water:        "#7cc4e8",
      waterLine:    "#6ab4d8",
      waterLabel:   "#3a7aad",
      // Land — warm natural tones
      background:   "#f7efe2",
      grass:        "#bdd87e",
      park:         "#bdd87e",
      wood:         "#6aad40",
      sand:         "#f2e4b8",
      // Residential — subtle warm
      residential:  "hsla(35,35%,90%,0.5)",
    };

    // Fetch the base style, tweak colors, add hillshading, then init map
    fetch("https://tiles.openfreemap.org/styles/bright")
      .then(r => r.json())
      .then(style => {
        // --- Apply color overrides ---
        for (const layer of style.layers) {
          const id = layer.id;
          const paint = layer.paint || {};

          // Water fills — zoom-based blue gradient (light → deep)
          if (id === "water" || id === "water-intermittent") {
            paint["fill-color"] = [
              "interpolate", ["linear"], ["zoom"],
              3,  "#a8d8ea",   // light sky blue zoomed out
              7,  "#5bb0d4",   // medium blue
              12, "#3a8fbf",   // deeper blue
              16, "#2a6f9e"    // deep blue zoomed in
            ];
          }
          // Waterway lines
          if (id.startsWith("waterway")) {
            if (paint["line-color"]) paint["line-color"] = COLOR_OVERRIDES.waterLine;
          }
          // Water labels
          if (id.includes("water") && id.includes("label")) {
            if (paint["text-color"]) paint["text-color"] = COLOR_OVERRIDES.waterLabel;
          }
          // Background
          if (id === "background") {
            paint["background-color"] = COLOR_OVERRIDES.background;
          }
          // Parks & grass
          if (id === "park" || id === "landcover-grass" || id === "landcover-grass-park") {
            paint["fill-color"] = COLOR_OVERRIDES.grass;
          }
          // Woods/forest
          if (id === "landcover-wood") {
            paint["fill-color"] = COLOR_OVERRIDES.wood;
            paint["fill-opacity"] = 0.3;
          }
          // Sand
          if (id === "landcover-sand") {
            paint["fill-color"] = COLOR_OVERRIDES.sand;
          }
          // Residential
          if (id === "landuse-residential" || id === "landuse-suburb") {
            paint["fill-color"] = COLOR_OVERRIDES.residential;
          }
          // Buildings — lighter, warmer
          if (id === "building" || id === "building-top") {
            paint["fill-color"] = "#f5ecde";
            if (paint["fill-outline-color"]) paint["fill-outline-color"] = "#e5d8c8";
          }

          // Roads — mute colors and reduce width at low zoom
          const isRoad = id.startsWith("highway-") || id.startsWith("tunnel-") || id.startsWith("bridge-");
          if (isRoad && layer.type === "line") {
            // Mute road fill colors (orange/yellow → soft grey/beige)
            const c = paint["line-color"];
            if (c === "#fc8" || c === "#fea") paint["line-color"] = "#e4d5c0";
            if (c === "#fff") paint["line-color"] = "#f2eade";
            // Mute casing colors
            if (c === "#e9ac77" || c === "rgba(200, 147, 102, 1)" || c === "hsl(28,76%,67%)") {
              paint["line-color"] = "#ccb8a0";
            }
            // Reduce opacity at low zoom for major roads
            if (id.includes("motorway") || id.includes("trunk") || id.includes("primary")) {
              if (!id.includes("link")) {
                paint["line-opacity"] = [
                  "interpolate", ["linear"], ["zoom"],
                  4, 0.3,
                  8, 0.6,
                  12, 1
                ];
              }
            }
          }

          layer.paint = paint;
        }

        // --- Add hillshading terrain source + layer ---
        style.sources["terrain"] = {
          type: "raster-dem",
          tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
          tileSize: 256,
          maxzoom: 15,
          encoding: "terrarium"
        };

        // Insert hillshade layer right after the background layer
        const bgIndex = style.layers.findIndex(l => l.id === "background");
        style.layers.splice(bgIndex + 1, 0, {
          id: "hillshade",
          type: "hillshade",
          source: "terrain",
          paint: {
            "hillshade-shadow-color": "#5a6858",
            "hillshade-illumination-direction": 315,
            "hillshade-exaggeration": [
              "interpolate", ["linear"], ["zoom"],
              2, 0.15,
              8, 0.3,
              14, 0.2
            ]
          }
        });

        // --- Create map with modified style ---
        initMap(style);
      });

    function initMap(style) {
    const map = new maplibregl.Map({
      container: "map",
      style: style,
      center: [10.4515, 51.1657],
      zoom: 5.5,
      maxBounds: [[3.5, 45.5], [17.5, 56.5]],
    });

    map.addControl(new maplibregl.NavigationControl(), "top-right");

    // Track base style layer IDs (filled after load, used for satellite toggle)
    let baseLayerIds = [];

    // --- DOM refs ---
    const sheet = document.getElementById("sheet");
    const sheetContent = document.getElementById("sheet-content");
    const locateBtn = document.getElementById("locateBtn");
    const satelliteBtn = document.getElementById("satelliteBtn");
    const seamapBtn = document.getElementById("seamapBtn");

    // --- Bottom sheet ---
    function closeSheet() {
      sheet.classList.remove("open");
      locateBtn.classList.remove("shifted");
      satelliteBtn.classList.remove("shifted");
      seamapBtn.classList.remove("shifted");
      map.getSource("highlight")?.setData({ type: "FeatureCollection", features: [] });
    }

    function openSheet(props, feature) {
      let html = '';

      // Check if this is a merged entry with multiple operators
      let operators;
      try {
        operators = props.operators ? JSON.parse(props.operators) : null;
      } catch { operators = null; }

      if (operators && operators.length > 1) {
        // Merged entry: show all operators
        for (let i = 0; i < operators.length; i++) {
          const op = operators[i];
          if (i > 0) html += '<div style="border-top:2px solid #E5E7EB;margin:12px 0;"></div>';
          html += `<div id="sheet-name">${esc(op.betreiber)}</div>`;
          if (op.anleger && op.anleger !== op.betreiber) {
            html += `<div id="sheet-anleger">${esc(op.anleger)}</div>`;
          }
          const addr = [op.strasse, `${op.plz || ""} ${op.ort || ""}`.trim()].filter(Boolean).join(", ");
          if (addr) html += row("Adresse", addr);
          if (op.gastliegeplaetze) html += row("Liegeplätze", op.gastliegeplaetze);
          if (op.telefon) html += row("Telefon", `<a href="tel:${op.telefon}">${esc(op.telefon)}</a>`);
          if (op.internet) {
            const url = op.internet.startsWith("http") ? op.internet : `https://${op.internet}`;
            html += row("Website", `<a href="${esc(url)}" target="_blank">${esc(op.internet)}</a>`);
          }
        }
        html += row("Gewässer", props.gewaesser);
        if (props.bundesland) html += row("Bundesland", props.bundesland);
      } else {
        // Single entry
        const address = [props.strasse, `${props.plz || ""} ${props.ort || ""}`.trim()]
          .filter(Boolean).join(", ");

        html += `<div id="sheet-name">${esc(props.betreiber)}</div>`;
        if (props.anleger && props.anleger !== props.betreiber) {
          html += `<div id="sheet-anleger">${esc(props.anleger)}</div>`;
        }
        html += row("Gewässer", props.gewaesser);
        if (address) html += row("Adresse", address);
        if (props.bundesland) html += row("Bundesland", props.bundesland);
        if (props.gastliegeplaetze) html += row("Liegeplätze", props.gastliegeplaetze);
        if (props.telefon) html += row("Telefon", `<a href="tel:${props.telefon}">${esc(props.telefon)}</a>`);
        if (props.internet) {
          const url = props.internet.startsWith("http") ? props.internet : `https://${props.internet}`;
          html += row("Website", `<a href="${esc(url)}" target="_blank">${esc(props.internet)}</a>`);
        }
      }

      sheetContent.innerHTML = html;
      sheet.classList.add("open");
      locateBtn.classList.add("shifted");
      satelliteBtn.classList.add("shifted");
      seamapBtn.classList.add("shifted");

      if (feature) {
        map.getSource("highlight")?.setData({
          type: "FeatureCollection",
          features: [feature]
        });
      }
    }

    function row(label, value) {
      return `<div class="sheet-row"><span class="sheet-label">${label}</span><span class="sheet-value">${value || "—"}</span></div>`;
    }

    function esc(str) {
      if (!str) return "—";
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    // Swipe-down to close
    let touchStartY = 0;
    sheet.addEventListener("touchstart", (e) => { touchStartY = e.touches[0].clientY; });
    sheet.addEventListener("touchmove", (e) => {
      if (e.touches[0].clientY - touchStartY > 60) closeSheet();
    });

    // --- Map load: add overlays & data ---
    map.on("load", () => {
      // Capture all base style layer IDs (for satellite toggle)
      baseLayerIds = map.getStyle().layers.map(l => l.id);

      // OpenSeaMap raster overlay
      map.addSource("openseamap", {
        type: "raster",
        tiles: ["https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png"],
        tileSize: 256,
        maxzoom: 18,
        attribution: '&copy; <a href="https://www.openseamap.org">OpenSeaMap</a>'
      });
      map.addLayer({
        id: "openseamap-layer",
        type: "raster",
        source: "openseamap",
        paint: {
          "raster-opacity": [
            "interpolate", ["linear"], ["zoom"],
            4, 0.5,
            8, 0.8,
            12, 0.5,
            15, 0.3
          ]
        }
      });

      // Esri satellite (hidden by default)
      map.addSource("esri-satellite", {
        type: "raster",
        tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
        tileSize: 256,
        maxzoom: 19,
        attribution: "&copy; Esri"
      });
      map.addLayer({
        id: "satellite-layer",
        type: "raster",
        source: "esri-satellite",
        layout: { visibility: "none" }
      }, baseLayerIds[0]); // Insert below all base layers

      // Highlight layer for selected marker
      map.addSource("highlight", {
        type: "geojson",
        data: { type: "FeatureCollection", features: [] }
      });
      map.addLayer({
        id: "highlight-point",
        type: "circle",
        source: "highlight",
        paint: {
          "circle-color": "#F1C40F",
          "circle-radius": 11,
          "circle-stroke-width": 2.5,
          "circle-stroke-color": "#ffffff"
        }
      });

      // Load location data
      fetch("./data/gelbe-welle-osm.json")
        .then(r => r.json())
        .then(data => {
          const features = [];
          const regionen = data.regionen || {};
          for (const [region, entries] of Object.entries(regionen)) {
            for (const entry of entries) {
              if (!entry.coordinates?.lat || !entry.coordinates?.lng) continue;
              const props = {
                  betreiber: entry.betreiber || "",
                  anleger: entry.anleger || "",
                  strasse: entry.strasse || "",
                  plz: entry.plz || "",
                  ort: entry.ort || "",
                  gewaesser: entry.gewaesser || "",
                  telefon: entry.telefon || "",
                  internet: entry.internet || "",
                  gastliegeplaetze: entry.gastliegeplaetze || "",
                  bundesland: entry.bundesland || region
                };
              if (entry.operators) {
                props.operators = JSON.stringify(entry.operators);
              }
              features.push({
                type: "Feature",
                geometry: {
                  type: "Point",
                  coordinates: [entry.coordinates.lng, entry.coordinates.lat]
                },
                properties: props
              });
            }
          }

          const geojson = { type: "FeatureCollection", features };

          map.addSource("locations", {
            type: "geojson",
            data: geojson,
            cluster: true,
            clusterMaxZoom: 14,
            clusterRadius: 50
          });

          map.addLayer({
            id: "clusters",
            type: "circle",
            source: "locations",
            filter: ["has", "point_count"],
            paint: {
              "circle-color": [
                "step", ["get", "point_count"],
                "rgba(70, 130, 169, 0.7)",
                10, "rgba(70, 130, 169, 0.8)",
                50, "rgba(70, 130, 169, 0.9)"
              ],
              "circle-radius": [
                "step", ["get", "point_count"],
                18, 10, 24, 50, 32
              ],
              "circle-stroke-width": 2,
              "circle-stroke-color": "rgba(255, 255, 255, 0.6)"
            }
          });

          map.addLayer({
            id: "cluster-count",
            type: "symbol",
            source: "locations",
            filter: ["has", "point_count"],
            layout: {
              "text-field": "{point_count_abbreviated}",
              "text-size": 13
            },
            paint: { "text-color": "#ffffff" }
          });

          map.addLayer({
            id: "unclustered-point",
            type: "circle",
            source: "locations",
            filter: ["!", ["has", "point_count"]],
            paint: {
              "circle-color": "#4682A9",
              "circle-radius": 8,
              "circle-stroke-width": 2.5,
              "circle-stroke-color": "#ffffff"
            }
          });

          document.title = `Gelbe Welle — ${features.length} Anlegestellen`;
        });
    });

    // --- Click handlers ---
    map.on("click", "clusters", async (e) => {
      const features = map.queryRenderedFeatures(e.point, { layers: ["clusters"] });
      if (!features.length) return;
      const clusterId = features[0].properties.cluster_id;
      const zoom = await map.getSource("locations").getClusterExpansionZoom(clusterId);
      map.flyTo({ center: features[0].geometry.coordinates, zoom, duration: 500 });
    });

    map.on("click", "unclustered-point", (e) => {
      if (!e.features?.length) return;
      e.originalEvent.stopPropagation();
      const feature = e.features[0];
      openSheet(feature.properties, feature);
      map.flyTo({
        center: feature.geometry.coordinates,
        zoom: Math.max(map.getZoom(), 14),
        duration: 500
      });
    });

    map.on("click", (e) => {
      const features = map.queryRenderedFeatures(e.point, {
        layers: ["clusters", "unclustered-point"]
      });
      if (features.length === 0) closeSheet();
    });

    map.on("mouseenter", "clusters", () => { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", "clusters", () => { map.getCanvas().style.cursor = ""; });
    map.on("mouseenter", "unclustered-point", () => { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", "unclustered-point", () => { map.getCanvas().style.cursor = ""; });

    // --- Locate me ---
    let userMarker = null;
    locateBtn.addEventListener("click", () => {
      navigator.geolocation.getCurrentPosition((pos) => {
        const lngLat = [pos.coords.longitude, pos.coords.latitude];
        map.flyTo({ center: lngLat, zoom: 14, duration: 1000 });
        if (!userMarker) {
          const el = document.createElement("div");
          el.style.cssText = "width:16px;height:16px;background:#4285F4;border:3px solid #fff;border-radius:50%;box-shadow:0 0 6px rgba(66,133,244,0.5);";
          userMarker = new maplibregl.Marker({ element: el }).setLngLat(lngLat).addTo(map);
        } else {
          userMarker.setLngLat(lngLat);
        }
      }, () => {
        alert("Standort konnte nicht ermittelt werden.");
      });
    });

    // --- Satellite toggle ---
    let satelliteOn = false;
    satelliteBtn.addEventListener("click", () => {
      satelliteOn = !satelliteOn;
      satelliteBtn.classList.toggle("active", satelliteOn);
      map.setLayoutProperty("satellite-layer", "visibility", satelliteOn ? "visible" : "none");
      for (const id of baseLayerIds) {
        try { map.setLayoutProperty(id, "visibility", satelliteOn ? "none" : "visible"); } catch {}
      }
    });

    // --- OpenSeaMap toggle ---
    let seamapOn = true;
    seamapBtn.classList.add("active");
    seamapBtn.addEventListener("click", () => {
      seamapOn = !seamapOn;
      seamapBtn.classList.toggle("active", seamapOn);
      map.setLayoutProperty("openseamap-layer", "visibility", seamapOn ? "visible" : "none");
    });

    } // end initMap
  </script>
</body>
</html>
